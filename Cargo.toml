[package]
name = "submux"
version = "0.0.3"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
description = "Subscription-native LLM gateway (Claude Max, ChatGPT Plus, future session providers)"
readme = "README.md"
keywords = ["llm", "gateway", "proxy", "anthropic", "openai"]
categories = ["api-bindings", "web-programming::http-server"]

[lib]
name = "submux"
path = "src/lib.rs"

[[bin]]
name = "submux"
path = "src/main.rs"

[features]
default = []
# Enable the Redis-backed cross-replica coordinator. The actual `redis`
# crate dependency is intentionally NOT declared here: turning on this
# feature today only unlocks the placeholder module in
# `src/coordination/redis.rs`. Adding the dep and writing the real impl
# is left to whoever first needs multi-replica deployment.
redis = []

[dependencies]
# async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
pin-project-lite = "0.2"

# http
axum = { version = "0.7", features = ["macros", "tokio"] }
hyper = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "http2", "cookies"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "timeout", "catch-panic"] }
http = "1"
http-body = "1"
bytes = "1"

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# errors
thiserror = "1"
eyre = "0.6"

# state
dashmap = "6"
arc-swap = "1"
moka = { version = "0.12", features = ["future"] }
parking_lot = "0.12"

# time / ids
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
ulid = { version = "1", features = ["serde"] }

# telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# crypto
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }
sha2 = "0.10"

# misc
url = { version = "2", features = ["serde"] }
once_cell = "1"

# storage (Phase 10)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "macros"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = false
